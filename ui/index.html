border-radius:24px;background:#252d27;display:flex;align-items:center;padding:0 14px;gap:8px}.search input{width:100%;background:none;border:0;outline:0;color:var(--text)}.account{margin-left:auto;color:var(--muted);font-size:12px}.main{padding:28px 34px 34px;max-width:1100px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 26px}.welcome h1{margin:0;font-size:34px;letter-spacing:-.055em}.welcome p{margin:7px 0 0;color:var(--muted)}.section{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-head h2{margin:0;font-size:20px;letter-spacing:-.035em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.card{background:rgba(22,27,23,.9);padding:13px;border-radius:9px;text-align:left;min-width:0;border:1px solid transparent}.card:hover{background:#202a22;border-color:rgba(30,215,96,.35)}.card img,.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#29332b;display:block;margin-bottom:11px}.card strong,.card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{margin-top:5px;color:var(--muted);font-size:11px}.rows{display:grid;gap:3px}.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:transparent;text-align:left;padding:9px;border-radius:7px}.row:hover{background:rgba(255,255,255,.08)}.row img,.row .thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#29332b}.row strong,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--muted);margin-top:4px}.row time{color:var(--muted);font-size:11px}.detail{display:flex;align-items:end;gap:22px;padding:20px 0 28px}.detail .art{width:190px;height:190px;margin:0}.detail h1{font-size:40px;letter-spacing:-.06em;margin:6px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing: .grid .card{display:flex;flex-direction:column;align-self:stretch;min-height:226px;height:100%;line-height:1.25}.grid .card img,.grid .card .card-placeholder{height:150px;min-height:150px;flex:0 0 150px;aspect-ratio:auto;object-fit:cover}.card-placeholder{display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,#28442d,#16251a 55%,#0d1510);color:#8fe5a5;font-size:42px;font-weight:300;letter-spacing:-.1em}.compact-note{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:rgba(23,27,24,.82);color:var(--muted)}

<div class="app"><div class="workspace"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M6.8 9.1c3.8-1.1 7.6-.7 10.6 1M7.6 12.2c3-.8 6.2-.5 8.8.7M8.5 15.1c2.4-.6 4.7-.3 6.7.7" fill="none" stroke="#071008" stroke-width="1.4" stroke-linecap="round"/></svg>Spotify</div><nav class="nav"><button data-view="home" class="active">⌂ &nbsp; Home</button><button data-view="search">⌕ &nbsp; Search</button><button data-view="library">▣ &nbsp; Your Library</button><button data-view="queue">≡ &nbsp; Queue</button></nav><h3>Playlists</h3><div id="playlistList" class="playlist-list"></div><div class="side-bottom"><button id="libraryAccess">＋ Enable saved library</button><button id="disconnect">Sign out of Spotify</button></div></aside><section class="content"><header class="topbar"><button id="back" class="circle" aria-label="Back">‹</button><button id="forward" class="circle" aria-label="Forward">›</button><form id="searchForm" class="search"><span>⌕</span><input id="query" placeholder="Search songs, artists, albums, playlists" aria-label="Search Spotify" /></form><span id="account" class="account">Checking account…</span></header><main id="main" class="main"></main></section></div><footer class="player"><div class="now"><img id="nowArt" alt=""><div><strong id="nowTitle">Nothing playing</strong><small id="nowArtist">Choose music to start listening</small></div></div><div class="transport"><div><button data-action="previous" aria-label="Previous">◀</button><button id="play" class="play" aria-label="Play">▶</button><button data-action="next" aria-label="Next">▶</button></div><div class="trackbar"><span id="progress"></span></div></div><div class="player-right"><button id="shuffle" class="pill" title="Shuffle">⇄</button><button id="repeat" class="pill" title="Repeat">↻</button><select id="devices" aria-label="Playback device"><option>No device</option></select><input id="volume" type="range" min="0" max="1 <script>
const $=id=>document.getElementById(id);let connected=false,playback=null,devices=[],selected=null,view="home",history=["home"],hi=0,busy=false,lastCallError=null;
const art=u=>u?`<img src="${u}" alt="">`:`<div class="thumb"></div>`;const artists=a=>(a||[]).map(x=>typeof x==="string"?x:x.name).join(", ");
function showError(e){let n=$("error");if(!n){n=document.createElement("div");n.id="error";n.className="error";$("main").prepend(n)}n.textContent=e?.message||String(e);n.style.display="block"}function clearError(){const n=$("error");if(n){n.textContent="";n.style.display="none"}}
async function call(c,a={}){if(busy)return null;busy=true;lastCallError=null;clearError();try{return await wm.call(c,a)}catch(e){lastCallError=e;showError(e);return null}finally{busy=false}}
function row(t){return`<button class="row" data-track="${t?.uri||""}">${art(t?.album?.artwork||t?.artwork)}<span><strong>${t?.name||"Unknown track"}</strong><small>${artists(t?.artists)}${t?.album?.name?" · "+t.album.name:""}</small></span><time>${t?.durationMs?Math.floor(t.durationMs/60000)+":"+String(Math.floor(t.durationMs/1000)%60).padStart(2,"0"):""}</time></button>`}
function card(x,kind){return`<button class="card" data-detail="${kind}:${x.id||""}">${x.artwork?art(x.artwork):`<div class="card-placeholder" aria-hidden="true">♫</div>`}<strong>${x.name||"Untitled"}</strong><small>${x.owner||artists(x.artists)||kind}</small></button>`}
function bind(){document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{selected={uri:b.dataset.track};wm.post({type:"surface-play",uri:selected.uri,trace:{id:crypto.randomUUID?.()||String(Date.now()),uiAt:Date.now(),isTrusted:true,selected}});});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{const p=b.dataset.detail.split(":");go("detail:"+p[0]+":"+p[1])})}
function nav(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",view===b.dataset.view||view.startsWith(b.dataset.view+":")))}
function set(html){$("main").innerHTML=html;bind();nav()}
function homeSection(title,items,status,render,empty){if(status==="unavailable")return`<section class="section"><div class="section-head"><h2>${title}</h2></div><div class="compact-note"><span>Enable listening history to personalize Home.</span><button class="pill" id="listeningAccess">Enable listening</button></div></section>`;if(!items.length)return`<section class="section"><div class="section-head"><h2>${title}</h2></div><div class="empty home-empty">${empty}</div></section>`;return`<section class="section"><div class="section-head"><h2>${title}</h2></div>${render(items)}</section>`}
async function home(){const d=await call("home")||{};$("playlistList").innerHTML=(d.playlists||[]).slice(0,12).map(x=>`<button class="playlist-link" data-detail="playlist:${x.id||""}">${x.name||"Untitled playlist"}</button>`).join("");const featuredFallback=d.featuredStatus==="unavailable"?"Featured playlists are unavailable right now.":"No featured playlists are available.";const featuredMarkup=(d.featured||[]).length?(d.featured||[]).slice(0,6).map(x=>card(x,"playlist")).join(""): `<div class="compact-note"><span>${featuredFallback}</span><button class="pill" data-view="search">Search music</button></div>`;set(`<div class="welcome home-hero"><div><div class="eyebrow">Spotify · Your home</div><h1>Made for your ears</h1><p>Pick up where you left off and discover the sounds you return to most.</p></div><button class="pill primary" data-view="search">Find something new</button></div>${homeSection("Recently played",d.recent||[],d.recentStatus||"empty",items=>`<div class="rows">${items.slice(0,8).map(row).join("")}</div>`,"Your recent listening will appear here after you play something.")}${homeSection("Your top tracks",d.topTracks||[],d.topTracksStatus||"empty",items=>`<div class="rows">${items.slice(0,8).map(row).join("")}</div>`,"Your top listening will appear here as Spotify learns what you love.")}<section class="section"><div class="section-head"><h2>Your playlists</h2><button class="pill" data-view="playlists">See all</button></div><div class="grid">${(d.playlists||[]).slice(0,6).map(x=>card(x,"playlist")).join("")||`<div class="empty">Your playlists will appear here.</div>`}</div></section><section class="section"><div class="section-head"><h2>Featured playlists</h2></div><div class="grid">${featuredMarkup}</div></section>`);$("listeningAccess")?.addEventListener("click",async()=>{await call("enableListening");home()})}
async function search(){const q=$("query").value.trim();if(!q)return home();const d=await call("search",{query:q})||{};set(`<div class="welcome"><div><div class="eyebrow">Search</div><h1>Results for “${q}”</h1><p>Browse tracks, albums, artists, and playlists separately.</p></div></div><section class="section"><div class="section-head"><h2>Tracks</h2></div><div class="rows">${(d.tracks||[]).map(row).join("")||`<div class="empty">No tracks found.</div>`}</div></section><section class="section"><div class="section-head"><h2>Albums</h2></div><div class="grid">${(d.albums||[]).map(x=>card(x,"album")).join("")||`<div class="empty">No albums found.</div>`}</div></section><section class="section"><div class="section-head"><h2>Artists</h2></div><div class="grid">${(d.artists||[]).map(x=>card(x,"artist")).join("")||`<div class="empty">No artists found.</div>`}</div></section><section class="section"><div class="section-head"><h2>Playlists</h2></div><div class="grid">${(d.playlists||[]).map(x=>card(x,"playlist")).join("")||`<div class="empty">No playlists found.</div>`}</div></section>`)}
async function library(){const d=await call("library");if(!d){const needsAccess=String(lastCallError?.message||"").includes("optional Library access");set(`<div class="welcome"><div><div class="eyebrow">Collection</div><h1>Your Library</h1><p>Saved albums and tracks from your Spotify account.</p></div></div><div class="consent"><h2>${needsAccess?"Enable saved library":"Library unavailable"}</h2><p>${needsAccess?"Spotify needs one-time permission to read your saved albums, tracks, and playlists.":"Spotify could not load your library right now. Try again in a moment."}</p>${needsAccess?`<button id="libraryAgain" class="pill primary">Enable saved library</button>`:`<button id="libraryAgain" class="pill">Try again</button>`}</div>`);$("libraryAgain")?.addEventListener("click",needsAccess?async()=>{await call("enableLibrary");library()}:library);return}set(`<div class="welcome"><div><div class="eyebrow">Collection</div><h1>Your Library</h1><p>Saved albums and tracks from your Spotify account.</p></div><button id="libraryAgain" class="pill">Refresh</button></div><section class="section"><div class="section-head"><h2>Saved albums</h2></div><div class="grid">${(d.albums||[]).map(x=>card(x,"album")).join("")||`<div class="empty">You have no saved albums yet.</div>`}</div></section><section class="section"><div class="section-head"><h2>Saved tracks</h2></div><div class="rows">${(d.tracks||[]).map(row).join("")||`<div class="empty">You have no saved tracks yet.</div>`}</div></section>`);$("libraryAgain")?.addEventListener("click",library)}
async function playlists(){const d=await call("playlists");if(!d)return;set(`<div class="welcome"><div><div class="eyebrow">Library</div><h1>Playlists</h1><p>Your personal Spotify playlists.</p></div></div><div class="grid">${(d.playlists||[]).map(x=>card(x,"playlist")).join("")||`<div class="empty">No playlists available yet.</div>`}</div>`)}
async function queue(){const d=await call("queue")||{};set(`<div class="welcome"><div><div class="eyebrow">Up next</div><h1>Queue</h1><p>See what is playing now and what comes after it.</p></div></div><section class="section"><div class="section-head"><h2>Now playing</h2></div><div class="rows">${d.currentlyPlaying?row(d.currentlyPlaying):`<div class="empty">Nothing is playing right now.</div>`}</div></section><section class="section"><div class="section-head"><h2>Next up</h2></div><div class="rows">${(d.queue||[]).map(row).join("")||`<div class="empty">Your queue is empty.</div>`}</div></section>`)}
async function detail(kind,id){const d=await call(kind,{id});if(!d)return;const x=d[kind]||{},tracks=d.tracks||x.tracks||[],label=kind==="playlist"?"Playlist":kind==="album"?"Album":"Artist",meta=kind==="playlist"?(x.owner?`By ${x.owner}`:""):kind==="album"?`${artists(x.artists)}${x.releaseDate?" · "+x.releaseDate:""}`:`${x.followers?x.followers.toLocaleString()+" followers":""}${x.genres?.length?" · "+x.genres.join(", "):""}`;let emptyMessage="No tracks available yet.";if(kind==="playlist"){emptyMessage=d.contentsStatus==="unavailable"?"Spotify returned this playlist, but its tracks are not available to this account. Only playlists you own or collaborate on expose items.":d.contentsStatus==="empty"?"This playlist is empty.":"Spotify did not return any track items."}set(`<div class="detail">${art(x.artwork)}<div><div class="eyebrow">${label}</div><h1>${x.name||"Untitled"}</h1><p class="muted">${x.description||meta}</p><button class="pill primary" data-detail-play="${tracks[0]?.uri||""}" ${tracks.length?"":"disabled"}>${tracks.length?"Play":"No playable tracks"}</button></div></div><div class="rows">${tracks.map(row).join("")||`<div class="empty">${emptyMessage}</div>`}</div>`);$("main").querySelector("[data-detail-play]")?.addEventListener("click",e=>{const uri=e.currentTarget.dataset.detailPlay;if(uri){selected={uri};wm.post({type:"surface-play",uri,trace:{id:crypto.randomUUID?.()||String(Date.now()),uiAt:Date.now(),isTrusted:true,selected}})}})}
async function go(v,replace=false){view=v;if(!replace){history=history.slice(0,hi+1);history.push(v);hi=history.length-1}nav();if(v==="home")return home();if(v==="search")return search();if(v==="library")return library();if(v==="playlists")return playlists();if(v==="queue")return queue();const p=v.split(":");if(p[0]==="detail")return detail(p[1],p[2])}
function state(s){connected=!!s.connected;playback=s.playback||null;devices=s.devices||devices;$("account").textContent=connected?"Spotify connected":"Not connected";const t=playback?.item||selected;$("nowTitle").textContent=t?.name||"Nothing playing";$("nowArtist").textContent=artists(t?.artists)||"Choose music to start listening";$("nowArt").src=t?.artwork||t?.album?.artwork||"";$("progress").style.width=playback?.item?.durationMs?Math.min(100,playback.progressMs/playback.item.durationMs*100)+"%":"0%";$("play").textContent=playback?.isPlaying?"Ⅱ":"▶";$("devices").replaceChildren(...(devices.length?devices.map(d=>{const o=new Option(d.name+(d.is_active?" · active":""),d.id||"");o.disabled=!d.id||d.is_restricted;return o}):[new Option("No Spotify device","")]));}
async function refresh(){const s=await call("status")||{};const d=await call("devices")||{};state({...s,devices:d.devices||[]});if(!connected){set(`<div class="consent"><div class="eyebrow">Welcome to Spotify</div><h2>Bring your music into Wonop</h2><p>Search songs, browse playlists and control Spotify playback from one focused workspace.</p><button id="connect" class="pill primary">Connect Spotify</button></div>`);$("connect").onclick=async()=>{await call("connect");refresh()};return}if(view==="home")home();}
$("searchForm").onsubmit=e=>{e.preventDefault();go("search")};$("back").onclick=()=>{if(hi){hi--;go(history[hi],true)}};$("forward").onclick=()=>{if(hi<history.length-1){hi++;go(history[hi],true)}};$("libraryAccess").onclick=async()=>{await call("enableLibrary");go("library")};$("disconnect").onclick=async()=>{await call("disconnect");refresh()};$("play").onclick=()=>{if(playback?.isPlaying)wm.post({type:"pause"});else if(selected?.uri)wm.post({type:"surface-play",uri:selected.uri,trace:{id:crypto.randomUUID?.()||String(Date.now()),uiAt:Date.now(),isTrusted:true,selected}});else if(playback?.item)wm.post({type:"resume"});else showError({message:"Choose a track before pressing play."})};document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>wm.post({type:b.dataset.action}));$("devices").onchange=()=>$("devices").value&&call("transfer",{deviceId:$("devices").value,play:false});$("volume").onchange=()=>call("volume",{percent:Number($("volume").value),deviceId:$("devices").value||undefined});$("shuffle").onclick=()=>call("shuffle",{state:true,deviceId:$("devices").value||undefined});$("repeat").onclick=()=>call("repeat",{state:"context",deviceId:$("devices").value||undefined});wm.onMessage(m=>{if(m.type==="state"){state(m)}if(m.type==="error")showError(m)});go("home",true);refresh();setInterval(refresh,8000);
</script><style>
.nav button,.playlist-link{padding:0 12px;line-height:16px}.nav button{display:flex;align-items:center;gap:10px;min-height:38px;border-left:3px solid transparent}.nav button.active{border-left-color:var(--green);padding-left:9px}.playlist-link{display:flex;align-items:center;min-height:34px}
